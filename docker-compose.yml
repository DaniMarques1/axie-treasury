version: '3.8'

services:
  web:
    build: .
    image: web:latest         # ← add this line
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"                # map host 8080 → container 80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - appnet

  networks:
    appnet:
      driver: bridge