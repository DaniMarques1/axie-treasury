services:
  web:
    build: .
    image: web:latest
    expose:
      - "3000"  # expose internally
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - appnet

  nginx:
    image: nginx:stable
    container_name: nginx-proxy
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - web
    networks:
      - appnet

networks:
  appnet:
    driver: bridge